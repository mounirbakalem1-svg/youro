<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#1f2937}
button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 30px #0001;padding:28px}
.login .card{width:min(400px,100%)}h1,h2,p{margin-top:0}.login input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #d7dce5;border-radius:10px}
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:#2563eb;color:#fff}.btn.danger{background:#dc2626}.btn.secondary{background:#e5e7eb;color:#111827}
#app{display:none}.layout{display:flex;min-height:100vh}.side{width:240px;background:#111827;color:#fff;padding:22px;position:fixed;right:0;top:0;bottom:0}
.side h2{margin:0 0 25px}.nav button{display:block;width:100%;text-align:right;border:0;background:transparent;color:#cbd5e1;padding:13px;border-radius:9px;cursor:pointer;margin:5px 0}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}
.main{margin-right:240px;width:calc(100% - 240px);padding:25px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{padding:20px;background:#fff;border-radius:15px;box-shadow:0 5px 20px #00000008}.stat b{font-size:28px;display:block;margin-top:8px}.section{display:none}.section.active{display:block}.tablebox{overflow:auto}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:right;padding:13px;border-bottom:1px solid #eee}th{background:#f8fafc}.badge{padding:5px 9px;border-radius:20px;font-size:12px;background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal .card{width:min(450px,100%)}.modal input,.modal select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}.actions{display:flex;gap:8px;justify-content:flex-start}
@media(max-width:800px){.side{width:70px;padding:12px}.side h2{font-size:0}.side h2:after{content:"AD";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:24px}.main{margin-right:70px;width:calc(100% - 70px)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <h1>لوحة الإدارة</h1>
    <p>تسجيل دخول تجريبي محلي</p>
    <label>اسم المستخدم</label>
    <input id="username" value="admin">
    <label>كلمة المرور</label>
    <input id="password" type="password" value="1234">
    <button class="btn" style="width:100%" onclick="login()">دخول</button>
    <p id="loginMsg" style="color:#dc2626;margin-top:12px"></p>
    <small>بيانات التجربة: admin / 1234</small>
  </div>
</div>

<div id="app">
<div class="layout">
<aside class="side">
  <h2>Admin</h2>
  <div class="nav">
    <button class="active" onclick="showSection('dashboard',this)">الرئيسية</button>
    <button onclick="showSection('users',this)">المستخدمون</button>
    <button onclick="showSection('settings',this)">الإعدادات</button>
    <button onclick="logout()">تسجيل الخروج</button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <div><h1>لوحة التحكم</h1><p>مرحباً بك في لوحة الإدارة.</p></div>
    <button class="btn" onclick="openModal()">+ إضافة مستخدم</button>
  </div>

  <section id="dashboard" class="section active">
    <div class="stats">
      <div class="stat">المستخدمون<b id="count">0</b></div>
      <div class="stat">النشطون<b id="activeCount">0</b></div>
      <div class="stat">طلبات اليوم<b>24</b></div>
      <div class="stat">الإيرادات<b>$1,280</b></div>
    </div>
    <div class="card">
      <h2>آخر المستخدمين</h2>
      <div class="tablebox"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الحالة</th></tr></thead><tbody id="recent"></tbody></table></div>
    </div>
  </section>

  <section id="users" class="section">
    <div class="card">
      <h2>إدارة المستخدمين</h2>
      <div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو البريد..." oninput="render()"></div>
      <div class="tablebox"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="usersTable"></tbody></table></div>
    </div>
  </section>

  <section id="settings" class="section">
    <div class="card">
      <h2>الإعدادات</h2>
      <label>اسم الموقع</label>
      <input id="siteName" value="My Admin" style="padding:12px;width:100%;margin:8px 0 15px;border:1px solid #ddd;border-radius:9px">
      <button class="btn" onclick="saveSettings()">حفظ الإعدادات</button>
      <p id="saved" style="color:#15803d;margin-top:12px"></p>
    </div>
  </section>
</main>
</div>
</div>

<div id="modal" class="modal">
 <div class="card">
  <h2>إضافة مستخدم</h2>
  <input id="newName" placeholder="الاسم">
  <input id="newEmail" placeholder="البريد الإلكتروني">
  <select id="newRole"><option>User</option><option>Admin</option></select>
  <select id="newStatus"><option value="نشط">نشط</option><option value="غير نشط">غير نشط</option></select>
  <div class="actions"><button class="btn" onclick="addUser()">إضافة</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>
 </div>
</div>

<script>
const defaultUsers=[
 {name:"Ahmed",email:"ahmed@example.com",role:"User",status:"نشط"},
 {name:"Sara",email:"sara@example.com",role:"Admin",status:"نشط"},
 {name:"Youssef",email:"youssef@example.com",role:"User",status:"غير نشط"}
];
let users=JSON.parse(localStorage.getItem("adminUsers")||"null")||defaultUsers;

function login(){
 const u=document.getElementById("username").value.trim(),p=document.getElementById("password").value;
 if(u==="admin"&&p==="1234"){localStorage.setItem("adminLogged","1");showApp()}
 else document.getElementById("loginMsg").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
}
function showApp(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";render()}
function logout(){localStorage.removeItem("adminLogged");location.reload()}
function showSection(id,btn){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
}
function render(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const list=users.filter(u=>(u.name+" "+u.email).toLowerCase().includes(q));
 document.getElementById("usersTable").innerHTML=list.map((u,i)=>`
 <tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td>
 <td><span class="badge">${esc(u.status)}</span></td>
 <td><button class="btn danger" onclick="removeUser(${users.indexOf(u)})">حذف</button></td></tr>`).join("");
 document.getElementById("recent").innerHTML=users.slice(-5).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.status)}</span></td></tr>`).join("");
 document.getElementById("count").textContent=users.length;
 document.getElementById("activeCount").textContent=users.filter(u=>u.status==="نشط").length;
 localStorage.setItem("adminUsers",JSON.stringify(users));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openModal(){document.getElementById("modal").style.display="grid"}
function closeModal(){document.getElementById("modal").style.display="none"}
function addUser(){
 const name=document.getElementById("newName").value.trim(),email=document.getElementById("newEmail").value.trim();
 if(!name||!email)return alert("أدخل الاسم والبريد.");
 users.push({name,email,role:document.getElementById("newRole").value,status:document.getElementById("newStatus").value});
 ["newName","newEmail"].forEach(id=>document.getElementById(id).value="");
 closeModal();render();
}
function removeUser(i){if(confirm("هل تريد حذف هذا المستخدم؟")){users.splice(i,1);render()}}
function saveSettings(){document.getElementById("saved").textContent="تم حفظ الإعدادات محلياً."}
if(localStorage.getItem("adminLogged")==="1")showApp();
</script>
</body>
</html>
